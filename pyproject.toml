[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myntra-review-discovery-engine"
version = "0.1.0"
description = "Discover why wishlist items stall, then rank 30-day conversion opportunities."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "google-play-scraper>=1.2.7",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
review-engine = "review_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_engine = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
