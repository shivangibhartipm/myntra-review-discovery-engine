# Pipeline config. Date windows are analysis clocks on observed_at;
# collected_at is ingest time only (see review_engine.windows).
#
# P1 credentials (optional, env): REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET,
# REDDIT_USER_AGENT, YOUTUBE_API_KEY.
# If HTTPS fails with CERTIFICATE_VERIFY_FAILED, set REQUESTS_CA_BUNDLE
# or REVIEW_ENGINE_SSL_VERIFY=false (local only).

as_of: null  # ISO date (YYYY-MM-DD). null = today (UTC).

storage:
  backend: sqlite  # local MVP; switch to postgres only if multi-user
  path: data/engine.db

windows:
  primary_months: 12
  recency_days: 90
  trend_start_months: 24
  trend_end_months: 18
  pdp_months: 12

models:
  runtime: ollama
  ollama_host: http://127.0.0.1:11434
  generate: qwen2.5:7b
  generate_upgrade: qwen2.5:14b
  generate_small: llama3.2:3b
  embed: nomic-embed-text

filter:
  version: filter_v9
  relevance_threshold: 0.5
  borderline_threshold: 0.35
  use_llm: true
  skip_if_same_version: true
  goldset_path: eval/goldset/relevance.jsonl
  sample_path: data/filter_audit_sample.json

extract:
  version: extract_v7
  use_llm: true
  skip_if_same_version: true
  goldset_path: eval/goldset/jobs_blockers.jsonl
  export_path: data/claims_export.jsonl

cluster:
  version: cluster_v9
  min_opportunities: 5
  max_opportunities: 12
  min_cluster_size: 2
  merge_cosine: 0.88
  use_embed: true
  use_llm: true
  skip_if_same_version: true
  export_path: data/opportunities_unranked.json
  name_overrides_path: data/opportunity_name_overrides.json

rank:
  version: rank_v1
  min_segment_n: 30
  top_n_compare: 8
  export_path: data/opportunities_ranked.json
  # Composite is documented in review_engine/rank/scoring.py (90-day default view).
  w1_metric_relevance: 1.0
  w2_postponement_rate: 0.8
  w3_prevalence_relevant: 0.5
  w4_recency_boost: 0.4
  w5_actionability: 0.6
  w6_loud_but_weak_penalty: 0.7

present:
  version: present_v1
  export_path: data/opportunities.json
  quotes_dir: data/quotes
  report_dir: data/reports
  web_data_dir: web/public/data
  audit_path: data/audit_snippets.jsonl
  top_n_onepagers: 8
  # ranked_path defaults to rank.export_path

sources:
  stub:
    enabled: false
    tier: phase0
    rate_limit_rps: 10
    daily_quota: 100
  play:
    enabled: true
    tier: P0
